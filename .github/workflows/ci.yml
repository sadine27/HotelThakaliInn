# The gate this repo ran on one laptop, by hand, until a dangling --ambient-bright
# reference broke `npm run check` and sat in main across two commits unnoticed.
# A push to main that passes deploys itself; one that doesn't, doesn't.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded PR run, never a main run — that one may be mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. dist/ is gitignored, so a separate deploy job would have
  # to upload and re-download the build or rebuild it; one job shares a disk free.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 to match local, and because scripts/sparkline-check.mjs imports
      # lib/sparkline.ts directly and needs Node's native type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Ask Cloudflare whether the token works before spending six minutes on a
      # build we could never ship. The fingerprint masks every letter and digit,
      # so a stray quote, space or wrong-length value shows up without the log
      # ever carrying the secret.
      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        run: |
          echo "token: ${#TOKEN} chars, shape $(printf '%s' "$TOKEN" | sed 's/[A-Za-z0-9]/x/g')"
          echo "account: ${#ACCOUNT} chars, shape $(printf '%s' "$ACCOUNT" | sed 's/[A-Za-z0-9]/x/g')"
          curl -sS --fail-with-body https://api.cloudflare.com/client/v4/user/tokens/verify             -H "Authorization: Bearer $TOKEN" | head -c 400
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm ci

      # typecheck + eslint + css-check + sparkline-check. No network, no secrets.
      - run: npm run check

      # Needs no credentials either: every D1-touching page is force-dynamic and
      # process.env appears nowhere in app/, lib/ or components/.
      - run: npm run build:vinext

      # Migrations are deliberately not applied here. 0016 does a DROP COLUMN;
      # a schema change landing from a push has no undo short of Time Travel.
      # `wrangler d1 migrations apply --remote` stays a human command.
      - name: Deploy to hotelthakaliinn.com
        if: github.event_name != 'pull_request'
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare challenges the runner's datacenter IP before the worker ever
      # runs, so CI cannot fetch the page the way a visitor does. A challenge
      # still proves the edge is up and routing this hostname; anything else --
      # a 5xx, a connection failure, an unexpected status -- is a real problem
      # and fails the run. Turn off Bot Fight Mode to get the strict check back.
      - name: Smoke check
        if: github.event_name != 'pull_request'
        run: |
          code=$(curl -sS --retry 3 --retry-delay 5 -D headers.txt -o body.html -w '%{http_code}' https://hotelthakaliinn.com)
          mitigated=$(tr -d '\015' < headers.txt | awk 'tolower($1) == "cf-mitigated:" { print $2 }')
          echo "status $code ${mitigated:+cf-mitigated: $mitigated}"
          if [ "$code" = 200 ]; then
            echo "serving"
          elif [ "$code" = 403 ] && [ "$mitigated" = challenge ]; then
            echo "edge challenged this runner; site reachable, page not verified from CI"
          else
            head -c 500 body.html; echo
            exit 1
          fi
