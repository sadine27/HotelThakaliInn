<!-- Same geometry as components/LogoMark.tsx, on the site's cream so the mark
     reads on a dark tab strip. App Router picks this up as the icon, which is
     what stops the /favicon.ico 404 (and the broken-icon glyph in the tab). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#ECE4D2" />
  <path d="M13 34 L50 6 L87 34" fill="none" stroke="#344E41" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter" />
  <rect x="24" y="32.5" width="52" height="4.8" fill="#6B705C" />
  <rect x="45.5" y="37.3" width="9" height="22" fill="#6B705C" />
  <rect x="24" y="38.5" width="9" height="57" fill="#344E41" />
  <rect x="67" y="38.5" width="9" height="57" fill="#344E41" />
  <rect x="33" y="64" width="34" height="8" fill="#344E41" />
</svg>
